<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b120d" />
    <meta name="description" content="A tiny sushi bar where everything wobbles. Scoop, press, slice and plate nigiri for jelly customers." />
    <title>Squishi.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='14' rx='7' fill='%23fbf8f0'/%3E%3Cpath d='M3 15c4-7 22-7 26 0v3H3z' fill='%23ff7a45'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="gl" aria-label="The sushi counter. Tap, hold and swipe to work each station."></canvas>

    <div id="hud" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="logo">Squishi.</span>
          <span class="mono" id="dayLabel">Day 1</span>
        </div>
        <div class="stats mono">
          <span class="stat">Served <b id="servedValue">0 / 3</b></span>
          <span class="stat">Tips <b id="tipsValue">¥0</b></span>
          <button class="chip-btn" id="muteBtn" type="button" aria-pressed="false">Sound</button>
          <button class="chip-btn rec" id="recBtn" type="button">Record</button>
          <button class="chip-btn" id="shotBtn" type="button">Photo</button>
        </div>
      </header>

      <aside class="ticket" id="ticket" hidden>
        <div class="ticket-head mono"><span id="ticketNo">No. 01</span><span id="ticketName">Mochi</span></div>
        <div class="ticket-body" id="ticketLines"></div>
        <div class="patience" aria-label="Patience"><i id="patienceBar"></i></div>
      </aside>

      <div class="hint" id="hint" aria-live="polite"></div>

      <div class="meter" id="meter" hidden>
        <span class="meter-label mono" id="meterLabel">Scoop</span>
        <div class="meter-track"><div class="band" id="meterBand"></div><div class="fill" id="meterFill"></div></div>
        <span class="meter-dots" id="meterDots"></span>
      </div>

      <div class="tools" id="tools" hidden role="radiogroup" aria-label="Topping"></div>
      <div class="actions" id="actions"></div>

      <nav class="stations" id="stations" aria-label="Stations">
        <button type="button" data-station="counter"><span class="num mono">01</span>Counter<i class="dot"></i></button>
        <button type="button" data-station="rice"><span class="num mono">02</span>Rice<i class="dot"></i></button>
        <button type="button" data-station="knife"><span class="num mono">03</span>Knife<i class="dot"></i></button>
        <button type="button" data-station="build"><span class="num mono">04</span>Build<i class="dot"></i></button>
      </nav>
    </div>

    <section class="screen title-screen" id="title">
      <div class="title-card">
        <p class="mono eyebrow">A very small sushi bar</p>
        <h1 class="logo-big">Squishi.</h1>
        <p class="lede">Scoop the rice, press it, slice the fish, plate it. The customers are jelly. So is everything else, a little.</p>
        <div class="days" id="dayList"></div>
        <div class="title-actions">
          <button class="btn btn-solid" id="startBtn" type="button">Open the shop</button>
          <a class="btn" href="./break.html">Break room</a>
        </div>
        <p class="mono foot">Tap, hold and swipe. Sound on.</p>
      </div>
    </section>

    <section class="screen card-screen" id="cardScreen" hidden>
      <div class="menu-card" id="card"></div>
    </section>

    <div class="preview" id="preview" hidden role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="preview-inner">
        <div class="mono" id="previewTitle">Clip ready</div>
        <div class="preview-media" id="previewMedia"></div>
        <div class="row">
          <button class="btn btn-solid" id="previewShare" type="button">Share</button>
          <button class="btn" id="previewDownload" type="button">Download</button>
          <button class="btn" id="previewClose" type="button">Close</button>
        </div>
      </div>
    </div>

    <div class="rec-frame" id="recFrame" hidden><span class="mono" id="recCount">6</span></div>
    <div class="toast mono" id="toast" role="status" hidden></div>

    <script type="module" src="/src/sushi/main.js"></script>
  </body>
</html>
