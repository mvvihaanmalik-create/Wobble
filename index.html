<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2a170e" />
    <meta name="description" content="A tiny sushi bar where everything wobbles. Scoop, press, slice and plate nigiri for small soft animals." />
    <title>Squishi.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='14' rx='7' fill='%23fbf8f0'/%3E%3Cpath d='M3 15c4-7 22-7 26 0v3H3z' fill='%23ff7a45'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="gl" aria-label="The sushi counter. Tap, hold and swipe to work each station."></canvas>

    <div id="hud" hidden>
      <header class="topbar">
        <div class="plaque">
          <span class="plaque-logo">Squishi</span>
          <span class="day-badge" id="dayBadge"><b id="dayNum">1</b><span lang="ja">日目</span></span>
        </div>
        <div class="hud-right">
          <div class="pill served" aria-label="Plates served"><span class="served-plates" id="servedPlates"></span></div>
          <div class="pill coins"><span class="ico" data-icon="coin"></span><b id="tipsValue">¥0</b></div>
          <button class="round-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Sound"><span class="ico" data-icon="soundOn"></span></button>
          <button class="round-btn rec" id="recBtn" type="button" aria-label="Record a clip"><span class="ico" data-icon="record"></span></button>
          <button class="round-btn" id="shotBtn" type="button" aria-label="Take a photo"><span class="ico" data-icon="camera"></span></button>
          <button class="round-btn" id="pauseBtn" type="button" aria-label="Pause"><span class="ico" data-icon="pause"></span></button>
        </div>
      </header>

      <aside class="ticket" id="ticket" hidden>
        <span class="peg" aria-hidden="true"></span>
        <div class="ticket-head"><span class="ticket-no" id="ticketNo">#01</span><span class="ticket-name" id="ticketName">Mochi</span></div>
        <div class="ticket-frame"><img class="ticket-photo" id="ticketPhoto" alt="The plate this guest wants" hidden /></div>
        <div class="ticket-body" id="ticketLines"></div>
        <div class="patience" aria-label="Patience"><span class="ico" data-icon="heart"></span><span class="patience-track"><i id="patienceBar"></i></span></div>
      </aside>

      <div class="hint" id="hintWrap" hidden><span class="hint-face ico" data-icon="pochi"></span><p class="hint-text" id="hint" aria-live="polite"></p></div>

      <div class="meter" id="meter" hidden>
        <span class="meter-label" id="meterLabel">Scoop</span>
        <div class="meter-track"><div class="band" id="meterBand"></div><div class="fill" id="meterFill"></div></div>
        <span class="meter-dots" id="meterDots"></span>
      </div>

      <div class="tools" id="tools" hidden role="radiogroup" aria-label="Topping"></div>
      <div class="actions" id="actions"></div>

      <nav class="stations" id="stations" aria-label="Stations">
        <button type="button" data-station="counter"><span class="key">1</span><span class="ico" data-icon="counter"></span><span class="label">Counter</span><span class="jp" lang="ja">受付</span><i class="flag" aria-hidden="true"></i></button>
        <button type="button" data-station="rice"><span class="key">2</span><span class="ico" data-icon="rice"></span><span class="label">Rice</span><span class="jp" lang="ja">酢飯</span><i class="flag" aria-hidden="true"></i></button>
        <button type="button" data-station="knife"><span class="key">3</span><span class="ico" data-icon="knife"></span><span class="label">Knife</span><span class="jp" lang="ja">包丁</span><i class="flag" aria-hidden="true"></i></button>
        <button type="button" data-station="build"><span class="key">4</span><span class="ico" data-icon="build"></span><span class="label">Build</span><span class="jp" lang="ja">盛付</span><i class="flag" aria-hidden="true"></i></button>
      </nav>
    </div>

    <section class="screen title-screen" id="title">
      <div class="title-card">
        <h1 class="logo-big" id="logoBig" aria-label="Squishi">Squishi</h1>
        <p class="tagline"><span lang="ja">小さな寿司屋</span> A very small sushi bar</p>
        <p class="lede">Scoop the rice, press it, slice the fish, plate it. The guests are small and soft. So is everything else, a little.</p>
        <div class="days" id="dayList"></div>
        <div class="title-actions">
          <button class="btn btn-solid btn-big" id="startBtn" type="button"><span>Open the shop</span><small lang="ja">開店</small></button>
          <button class="btn" id="wallBtn" type="button">The wall</button>
          <a class="btn" href="./break.html">Break room</a>
        </div>
        <p class="foot">Tap, hold and swipe. Sound on.</p>
      </div>
    </section>

    <section class="screen wall-screen" id="wall" hidden role="dialog" aria-modal="true" aria-labelledby="wallTitle">
      <div class="wall">
        <header class="wall-head">
          <div class="ribbon"><h2 id="wallTitle">The wall</h2><span lang="ja">掲示板</span></div>
          <p class="wall-note" id="wallNote"></p>
          <button class="round-btn close-btn" id="wallClose" type="button" aria-label="Close">&times;</button>
        </header>
        <div class="wall-body">
          <section class="board" aria-label="Best shifts">
            <h3>Best shifts</h3>
            <ol id="wallBoard"></ol>
          </section>
          <section class="cork" aria-label="Plates"><div class="wall-plates" id="wallPlates"></div></section>
        </div>
      </div>
    </section>

    <section class="screen card-screen" id="cardScreen" hidden>
      <div class="panel" id="card"></div>
    </section>

    <div class="preview" id="preview" hidden role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="panel preview-inner">
        <div class="ribbon"><h2 id="previewTitle">Clip ready</h2></div>
        <div class="preview-media" id="previewMedia"></div>
        <div class="row">
          <button class="btn btn-solid" id="previewShare" type="button">Share</button>
          <button class="btn" id="previewDownload" type="button">Download</button>
          <button class="btn" id="previewClose" type="button">Close</button>
        </div>
      </div>
    </div>

    <div class="rec-frame" id="recFrame" hidden><span class="rec-count"><i></i><b id="recCount">6</b></span></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="popups" id="popups" aria-live="polite"></div>
    <div class="hold-ring" id="holdRing" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" class="edge" />
        <circle cx="50" cy="50" r="40" class="track" />
        <circle cx="50" cy="50" r="40" class="band" id="holdBand" />
        <circle cx="50" cy="50" r="40" class="prog" id="holdProg" />
      </svg>
    </div>

    <script type="module" src="/src/sushi/main.js"></script>
  </body>
</html>
